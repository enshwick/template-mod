# Prose checks for the repository's documents. The hand-written rules sit in
# .vale/styles, Enshwick among them with this project's own. The generated
# ones (dictionaries, phrase lists) are built into the same folder by the
# maintainers' tooling and stay out of git; `vale sync` fetches the packages.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.25.0/ai-tells.zip, https://github.com/errata-ai/write-good/releases/download/v0.4.1/write-good.zip

[*.md]
BasedOnStyles = ProseCore, ProseEN, ENDocs, ai-tells, write-good
# Comments in code samples are not prose of the page.
ProseCore.CommentLanguage = NO
# Typography rules want typographic quotes that Markdown sources do not use.
ProseCore.Typography = NO
Vale.Terms = NO
# E-Prime bans every form of "to be", which plain player text needs.
write-good.E-Prime = NO
write-good.Passive = suggestion
# Lists that start with "So" do not occur; the rule fires on ordinary sentences.
write-good.So = NO
write-good.TooWordy = NO
# A step is one short action by design, such as "Start the game.".
ai-tells.MicDrop = NO

[docs/*.uk.md]
BasedOnStyles = ProseCore, UKBase, UKDocs, ProseUK, Enshwick
ProseCore.CommentLanguage = NO
ProseCore.Typography = NO
Vale.Terms = NO
# Vale's regexp2 runs out of backtracking stack on this rule's thousands of
# swaps and panics on ordinary words, so every Ukrainian page would go unchecked.
ProseUK.Barbarism = NO
# Replaced by Enshwick.NotUkrainian, which keeps this project's words out.
ProseUK.NotUkrainian = NO
