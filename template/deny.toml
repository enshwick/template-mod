[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

[advisories]
yanked = "deny"
unmaintained = "workspace"

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "Zlib", "Unicode-3.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "deny"
# Duplicates allowed on purpose, each with its reason.
skip = []
allow-wildcard-paths = true
wildcards = "deny"
# The game process makes no HTTP or TLS calls and checks no signatures:
# players install and update through a mod manager.
deny = [
    { crate = "ureq", reason = "no HTTP client in the game process" },
    { crate = "rustls", reason = "no TLS in the game process" },
    { crate = "ring", reason = "no TLS in the game process" },
    { crate = "webpki-roots", reason = "no TLS in the game process" },
    { crate = "minisign-verify", reason = "releases are not signature-checked in game" },
    { crate = "percent-encoding", reason = "no HTTP client in the game process" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
