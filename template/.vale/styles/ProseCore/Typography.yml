# Below word level, so accept.txt does not reach it.
extends: existence
message: "Typographic slip: '%s'"
level: suggestion
nonword: true
tokens:
  # ai-tells.EmDashUsage covers the em dash wherever that package is loaded, so
  # the config turns this rule's dash off there rather than counting it twice.
  - '—'
  - '–'
  - '\S  +\S'
  - ' [.!?;:]'
  - '\.\.\.'
