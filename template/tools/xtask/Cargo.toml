[package]
name = "xtask"
version = "0.0.0"
description = "Repository tasks: the checks a change needs, run as cargo xtask"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[dependencies]
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
zip = { version = "9.1.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true
