pre-commit:
  parallel: true
  commands:
    rustfmt:
      glob:
        - '*.rs'
        - '**/*.rs'
      run: cargo fmt --all --check
    markdown:
      glob: '*.md'
      exclude:
        - '**/CHANGELOG.md'
      run: bunx markdownlint-cli2 --no-globs {staged_files}
    typos:
      run: typos --force-exclude {staged_files}

# committed checks the header against committed.toml. Messages git writes
# itself (merges, reverts, fixups) pass as they are. A subject starts in
# lower case, and angle brackets would read as HTML in the release notes.
commit-msg:
  commands:
    conventional:
      run: >-
        head -n1 {1} | grep -qE '^(Merge |Revert "|fixup! |squash! |amend! )' ||
        { committed --commit-file {1} &&
        ! head -n1 {1} | grep -E ': [A-Z]|[<>]'; }

# Nothing that compiles: the hook stays under ten seconds. The compiling
# checks are `cargo xtask check` (what the branch touches) and
# `cargo xtask check --all` (everything); they gate merges.
pre-push:
  parallel: true
  commands:
    rustfmt:
      glob:
        - '*.rs'
        - '**/*.rs'
      run: cargo fmt --all --check
    markdown:
      glob: '*.md'
      exclude:
        - '**/CHANGELOG.md'
      run: bunx markdownlint-cli2 --no-globs {push_files}
    typos:
      run: typos --force-exclude {push_files}
    commits:
      # A repository's first push has no origin/main to compare with.
      run: >-
        ! git rev-parse -q --verify origin/main > /dev/null ||
        { committed origin/main..HEAD &&
        ! git log --no-merges --format=%s origin/main..HEAD | grep -E ': [A-Z]|[<>]'; }
    deny:
      glob:
        - 'Cargo.toml'
        - '**/Cargo.toml'
        - 'Cargo.lock'
        - 'deny.toml'
      # Advisories need the network and change without any commit: CI's
      # full suite checks them every night.
      run: cargo deny check bans licenses sources
