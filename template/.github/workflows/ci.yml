# The merge gate: `cargo xtask check` through the shared workflow. While the
# owner's PC is online the whole check runs there natively; otherwise it runs
# on a GitHub-hosted runner. A push to main fills the build caches pull
# requests start from. The nightly lane adds unused dependencies, coverage,
# external links and benchmarks.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:
    inputs:
      nightly:
        description: Also run the nightly lane.
        type: boolean
        default: false

permissions: {}

concurrency:
  # Only a pull request's newer push cancels its older run: a run on main
  # fills the caches pull requests start from and must finish.
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    # main: the organization runners run only workflows from main.
    uses: enshwick/.github/.github/workflows/rust-ci.yml@main # zizmor: ignore[unpinned-uses]
    permissions:
      contents: read
    # The enshwick-ci app tells the shared workflow whether the PC is online.
    secrets:
      ENSHWICK_CI_CLIENT_ID: ${{ secrets.ENSHWICK_CI_CLIENT_ID }}
      ENSHWICK_CI_PRIVATE_KEY: ${{ secrets.ENSHWICK_CI_PRIVATE_KEY }}

  nightly:
    if: github.event_name == 'schedule' || inputs.nightly
    uses: enshwick/.github/.github/workflows/rust-nightly.yml@main # zizmor: ignore[unpinned-uses]
    permissions:
      contents: read
