# Renders the template on every pull request: mod ids are <author>.<name>,
# and a bare name or a second dot is refused.
name: check

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: check-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  template:
    permissions:
      contents: read
    # main: the organization runners run only workflows from main.
    uses: enshwick/.github/.github/workflows/copier-template.yml@main # zizmor: ignore[unpinned-uses]
    with:
      render: |
        mod_id=enshwick.test-mod
        mod_id=someone.x2 side=client
        mod_id=enshwick.git-mod enshwick_rev=6477a95ffec44997eff6b58cb834beb200072b6a
      refuse: |
        mod_id=test-mod
        mod_id=enshwick.git-mod enshwick_rev=6477a95
        mod_id=a.b.c
        mod_id=Upper.case
