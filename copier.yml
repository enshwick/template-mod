_subdirectory: template
_answers_file: .copier-answers.yml
# The mod's own code, texts and player pages start from the template and
# are the mod's from then on: copier update neither changes them nor adds
# them to a mod that has none.
_exclude:
  - "{% if _copier_operation == 'update' %}src/lib.rs{% endif %}"
  - "{% if _copier_operation == 'update' %}src/texts.toml{% endif %}"
  - "{% if _copier_operation == 'update' %}docs/player.md{% endif %}"
  - "{% if _copier_operation == 'update' %}docs/player.uk.md{% endif %}"
_min_copier_version: "9.5"

# `<author>.<name>`, each part of [a-z0-9-], at most 64 characters in all:
# the rule the loader checks. The name part names the crate, the repository
# and the mod's type.
mod_id:
  type: str
  help: The mod's id, <author>.<name>, each part of [a-z0-9-], at most 64 characters (enshwick.build-camera)
  validator: >-
    {% if not (mod_id | regex_search('^[a-z0-9-]+\\.[a-z0-9-]+$')) or (mod_id | length) > 64 %}not <author>.<name> of [a-z0-9-], at most 64 characters{% endif %}

mod_name:
  type: str
  help: The name players read, in title case; every language shows it unchanged
  default: "{{ (mod_id.split('.') | last) | replace('-', ' ') | title }}"

description:
  type: str
  help: What the mod does, in one sentence
  default: "What {{ mod_name }} does, in one sentence"

side:
  type: str
  help: Where the mod runs
  choices: [server, client, both]
  default: server

crate_name:
  type: str
  help: The crate, and the DLL as crate_name with underscores
  default: "enshwick-{{ mod_id.split('.') | last }}"

enshwick_version:
  type: str
  help: The enshwick crate version the mod builds on
  default: "1.0.0-alpha.11"

repository:
  type: str
  help: The mod's GitHub repository
  default: "enshwick/mod-{{ mod_id.split('.') | last }}"
